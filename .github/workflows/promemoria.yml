# Sveglia dei promemoria lezioni ad app chiusa (Web Push): push/clock.mjs dorme fino all'orario esatto e lancia reminders.yml su corsi-data.
# Catena dom-ven: ogni run a fine finestra rilancia se stesso (workflow_dispatch con GITHUB_TOKEN). Il cron di GitHub arriva con ~6 h di ritardo, quindi serve solo a riavviare la catena se si spezza.
# Domenica mattina la fa ripartire dopo la pausa del fine settimana (primo orario: 17:55 di domenica). Concurrency: un solo run alla volta, un cron in attesa viene sostituito dal rilancio, quindi niente catene doppie.
name: promemoria
on:
  schedule:
    - cron: '7 */3 * * 1-5'
    - cron: '7 6,8,10 * * 0'
  workflow_dispatch: # prova: un lancio subito a vuoto (DRY) su corsi-data; dry=false avvia la sveglia vera
    inputs:
      dry: { type: boolean, default: true }
      da: { type: string, required: false } # fine finestra del run precedente, lo passa clock.mjs
concurrency: { group: "promemoria-${{ inputs.dry && 'dry' || 'run' }}", cancel-in-progress: false } # le prove DRY non devono sostituire il rilancio in attesa
permissions:
  contents: read
  actions: write
jobs:
  sveglia:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, sparse-checkout: push }
      - run: node push/clock.mjs
        env:
          TZ: Europe/Rome
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry }}
          DA: ${{ inputs.da }}
          GH_TOKEN: ${{ secrets.READ_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
