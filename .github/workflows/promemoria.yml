# Sveglia dei promemoria lezioni ad app chiusa (Web Push): push/clock.mjs dorme fino all'orario esatto e lancia reminders.yml su corsi-data.
# Il cron di GitHub arriva in ritardo o salta, quindi i run partono ore prima (orari UTC: 07:07/11:13/16:23 di Roma d'estate, un'ora prima d'inverno).
# Due cron per fascia: se uno salta copre l'altro; concurrency li mette in fila e chi parte dopo prende solo gli orari ancora futuri.
name: promemoria
on:
  schedule:
    - cron: '7 5 * * 1-5'
    - cron: '47 5 * * 1-5'
    - cron: '13 9 * * 1-4'
    - cron: '53 9 * * 1-4'
    - cron: '23 14 * * 0-4'
    - cron: '3 15 * * 0-4'
  workflow_dispatch: # prova: un lancio subito a vuoto (DRY) su corsi-data; dry=false avvia la sveglia vera (se il cron salta)
    inputs:
      dry: { type: boolean, default: true }
concurrency: { group: promemoria, cancel-in-progress: false }
permissions:
  contents: read
jobs:
  sveglia:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, sparse-checkout: push }
      - run: node push/clock.mjs
        env:
          TZ: Europe/Rome
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry }}
          GH_TOKEN: ${{ secrets.READ_PAT }}
